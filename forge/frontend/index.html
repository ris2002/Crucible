<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <title>Crucible — Ideas Under Pressure</title>
    <meta name="description" content="Crucible is a platform for intellectual ideas, refined through AI and shared with the world." />
    <style>
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #faf9f7;
        z-index: 9999;
        gap: 20px;
        transition: opacity 0.4s ease;
      }
      #splash.fade-out { opacity: 0; pointer-events: none; }
      #splash img { width: 120px; height: 120px; object-fit: contain; }
      #splash-title {
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 2rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: #1a1a1a;
        text-transform: uppercase;
      }
      #splash-tagline {
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 0.85rem;
        letter-spacing: 0.2em;
        color: #8B5E3C;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <img src="/favicon.png" alt="Crucible" />
      <div id="splash-title">Crucible</div>
      <div id="splash-tagline">Ideas Under Pressure</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      window.__hideSplash = function() {
        var s = document.getElementById('splash');
        if (s) {
          s.classList.add('fade-out');
          setTimeout(function() { s.remove(); }, 450);
        }
      };
    </script>
  </body>
</html>
